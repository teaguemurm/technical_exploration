name: technical_exploration
description: Offline one-screen note generator that runs a local GGUF model.
publish_to: "none"
version: 0.1.0

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter
  file_picker: ^13.1.0
  llm_llamacpp: ^0.7.0
  path_provider: ^2.1.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/system_prompt.txt
    - assets/prompts.json
    - assets/dataset.json
    - assets/simulated_rag.json
